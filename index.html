<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat+Brush&display=swap');
:root{
  --navy:#1e4632;--azul:#b5553a;--azul2:#d9733f;
  --claro:#f6efe2;--linha:#e6dccb;--texto:#2a2620;--cinza:#6b645a;
  --amarelo:#f2b630;--vermelho:#c8322a;--creme:#fbf8f2;
  --mao:'Caveat Brush',cursive;
}
body{background:var(--creme)}
header{background:rgba(251,248,242,.97)}

/* Fonte manual: o S e a pergunta */
.mono{font-family:var(--mao);font-size:1.9rem;font-weight:400}
.hero-txt h1 em{font-family:var(--mao);font-style:normal;color:var(--amarelo);font-weight:400}
.phead::after{font-family:var(--mao);font-weight:400;color:rgba(242,182,48,.09)}
.sde .eyebrow{font-family:var(--mao);font-size:1.9rem;letter-spacing:0;text-transform:none;color:var(--navy);font-weight:400}
.words b{color:var(--vermelho);font-family:var(--mao);font-weight:400;font-size:1.5rem}

/* Áreas escuras */
.hero-txt .eyebrow,.phead .eyebrow,.feature .eyebrow{color:var(--amarelo)}
.hero-txt p,.phead p,.feature p{color:#dfe8dc}

/* Botões */
.btn-w{background:var(--amarelo);color:var(--navy)}
.btn-w:hover{background:#ffc94d}
.menu a.cta{background:var(--vermelho)}
.menu a.cta:hover{background:#a8261f}

/* Espaços de foto ainda vazios */
.ph{background:repeating-linear-gradient(135deg,#efe6d6 0 12px,#f5eee2 12px 24px);color:#9a8b73}
.ph.dark{background:repeating-linear-gradient(135deg,#1e4632 0 12px,#22503a 12px 24px);color:#b9cdb8}
.ph.dark span{background:rgba(30,70,50,.6)}

/* Cultura e modal */
.cc .ov{background:linear-gradient(transparent 35%,rgba(30,70,50,.92))}
.cc .ov small{color:var(--amarelo)}
.cc .ov p{color:#e7eee3}
.modal{background:rgba(20,40,28,.78)}

/* Mapa */
.pin circle.c{fill:var(--navy)}
.map,.ba{background:var(--claro)}

/* Formulário */
input,select,textarea,.types label{border-color:#d9cdb8}
input:focus,select:focus,textarea:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(181,85,58,.15)}
.drop{border-color:#d4b89a;background:#fffaf2}

/* Rodapé */
footer{background:#163626;color:#c9d6c4}
.credits small{color:#9fb39a}
footer .brand small{color:#9fb39a!important}
</style>
